<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2027 유럽 10일 – 스마트 플래너</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f4f8fc;--card:#fff;--tx:#1b2a3a;--mu:#5d6d7e;--ac:#2f7de1;--bd:#d9e4f0;--sea:#e6f0fb}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,sans-serif;height:100vh;overflow:hidden}
.main-wrapper{display:flex;height:100vh}
@media(max-width:850px){.main-wrapper{flex-direction:column}}
#map-section{flex:1.2;position:relative;border-right:1px solid var(--bd)}
#map{height:100%;width:100%}
#info-section{flex:1;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.sticky-header{flex:none;background:var(--card);border-bottom:1px solid var(--bd);z-index:10}
.header-main{padding:16px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px}
.tabs button{flex:none;border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:6px 14px;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.f-tabs{display:flex;background:var(--sea);padding:4px;border-radius:12px;margin:0 16px 12px}
.f-tabs button{flex:1;border:0;background:transparent;padding:8px 2px;cursor:pointer;font-size:.78rem;white-space:nowrap}
.f-tabs button.on{background:var(--card);color:var(--ac);font-weight:bold;border-radius:8px}
#view{flex:1;overflow-y:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px;margin-bottom:16px}
.b{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px;width:100%;cursor:pointer;font-weight:bold;margin-top:10px}
.b.h{background:#fff;color:var(--ac);border:1px solid var(--ac);font-weight:normal;text-align:left;font-size:.82rem;padding:8px}
textarea,input,select{box-sizing:border-box;border:1px solid var(--bd);border-radius:10px;padding:9px;font-family:inherit;font-size:.9rem;background:#fff;color:var(--tx)}
textarea{width:100%;border-radius:12px;padding:12px;margin-top:10px;resize:none}
.expense-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}
.pin,.num{width:26px;height:26px;border-radius:50%;background:#2f7de1;color:#fff;border:2px solid #fff;font:700 12px/22px sans-serif;text-align:center;box-sizing:border-box}
.num{flex:none;border:0;line-height:26px}
.pin.f,.num.f{background:#e8590c}.pin.c,.num.c{background:#8b5a2b}.pin.e,.num.e{background:#2e9e5b}
.bg{background:#d9f2e0;color:#0a7a33;border-radius:10px;padding:2px 8px;font-size:.72rem;margin-left:6px;font-weight:normal;vertical-align:middle}
.pl{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid #eee;flex-wrap:wrap}
.nm{flex:1;min-width:130px}
.tag{font-size:.7rem;border-radius:8px;padding:1px 6px;background:#d9f2e0;color:#0a7a33;margin-left:4px}.tag.g{background:#eee;color:#777}
.ctl{display:flex;gap:4px}.ctl button{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:4px 8px;cursor:pointer}.ctl select{padding:4px}
.leg{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--sea);border-radius:10px;padding:6px 10px;margin:0 0 6px 34px;font-size:.82rem;color:var(--mu)}
.leg select,.leg input{padding:4px 6px;font-size:.82rem}.leg input{width:62px}
.leg .lk{padding:3px 7px;font-size:.8rem}
.sum{font-size:.85rem;color:var(--ac);font-weight:bold;margin:2px 0 8px}
.row2{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.lk{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:4px 8px;text-decoration:none;font-size:.85rem}
.sticky-header{position:relative;overflow:hidden;background:linear-gradient(135deg,#1d3b78 0%,#2f7de1 60%,#7ab8f5 100%);border-bottom:0}
.sticky-header::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#0055a4 33.3%,#fff 33.3% 66.6%,#ef4135 66.6%);z-index:2}
.sticky-header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:70px;background:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20540%2060'%20preserveAspectRatio='xMinYMax%20slice'%3E%3Cg%20fill='white'%3E%3Cpath%20d='M62%2060L74%2018L77%204L80%2018L92%2060L86%2060L80%2034L74%2034L68%2060Z'/%3E%3Crect%20x='70'%20y='30'%20width='14'%20height='2'/%3E%3Cpath%20d='M140%2060V26L146%204L152%2026V60ZM160%2060V26L166%204L172%2026V60ZM140%2040H172V60H140Z'/%3E%3Cpath%20d='M200%2060V38L210%2028L220%2038V60ZM220%2060V32L232%2020L244%2032V60ZM244%2060V40L252%2032L260%2040V60Z'/%3E%3Ccircle%20cx='320'%20cy='30'%20r='5'/%3E%3Ccircle%20cx='308'%20cy='44'%20r='5'/%3E%3Ccircle%20cx='332'%20cy='44'%20r='5'/%3E%3Ccircle%20cx='320'%20cy='52'%20r='5'/%3E%3Ccircle%20cx='320'%20cy='42'%20r='5'/%3E%3Cpath%20d='M360%2060L366%2034H374L380%2060Z'/%3E%3Cpath%20d='M420%2060V36H434V60ZM418%2036L427%2022L436%2036Z'/%3E%3Cpath%20d='M470%2060V26H482V60ZM488%2060V26H500V60ZM482%2038H488V60H482Z'/%3E%3C/g%3E%3Cg%20stroke='white'%20stroke-width='2'%3E%3Cpath%20d='M370%2034L356%2020M370%2034L384%2020M370%2034L356%2048M370%2034L384%2048'/%3E%3Cpath%20d='M320%2030L308%2044M320%2030L332%2044M308%2044H332M320%2042V52'/%3E%3C/g%3E%3C/svg%3E") repeat-x left bottom/540px 60px;opacity:.22;pointer-events:none}
.header-main,.tabs,.f-tabs{position:relative;z-index:1}
.header-main h1{color:#fff;font-family:Georgia,"Times New Roman",serif;letter-spacing:.5px}
.header-main p{color:#dbe8fb!important}
.tabs button.on{background:#ffd166;color:#1b2a3a;border-color:#ffd166}
#info-section{background:linear-gradient(180deg,#e3effc 0,#f4f8fc 260px)}
.card{box-shadow:0 2px 12px rgba(30,60,120,.09)}
.b{background:linear-gradient(135deg,#2f7de1,#1d5fc4)}
</style>
</head>
<body>
<div class="main-wrapper">
<div id="map-section"><div id="map"></div></div>
<div id="info-section">
<div class="sticky-header">
<div class="header-main">
<h1 style="font-size:1.1rem;margin:0">🇪🇺 유럽 여행 공동 플래너<span class="bg">공동 편집</span></h1>
<p style="font-size:.8rem;color:var(--mu);margin:4px 0 0" id="sync-status">김예림 & 전은경 전용</p>
</div>
<div class="tabs" id="day-tabs"></div>
<div class="f-tabs" id="feature-tabs">
<button data-f="info" class="on" onclick="setF('info')">📋 일정</button>
<button data-f="rest" onclick="setF('rest')">🍴 식당</button>
<button data-f="stay" onclick="setF('stay')">🛏️ 숙소</button>
<button data-f="money" onclick="setF('money')">💰 정산</button>
<button data-f="check" onclick="setF('check')">✅ 준비물</button>
</div>
</div>
<div id="view"></div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const GAS_URL="https://script.google.com/macros/s/AKfycbyKjR9esF9OZDWL19tGMZKzD6IlPAho9H624_YLb7735r_7okYGExB0t_-sojZWn7it/exec";

const D=[
["2/15 (월)","인천 출발",[["인천국제공항",37.4602,126.4407]]],
["2/16 (화)","파리 도착 + 라파예트 + 개선문",[["샤를드골 공항",49.0097,2.5479],["갤러리 라파예트(옥상 전망)",48.8738,2.332],["샹드마르스 공원",48.8556,2.2986],["에펠탑",48.8584,2.2945],["트로카데로 광장(일몰)",48.8616,2.2874],["개선문(야경)",48.8738,2.295]]],
["2/17 (수)","시테섬 + 미술관 (저녁 유람선)",[["노트르담 대성당(외관·시테섬)",48.853,2.3499],["생트샤펠(시테섬·선택)",48.8554,2.345],["카페 드 플로르(점심·휴식)",48.8542,2.3326],["오르세 미술관",48.86,2.3266],["센 강 유람선(저녁)",48.8606,2.2936]]],
["2/18 (목)","몽마르트르 + 샹젤리제 + 라발레 빌리지",[["몽마르트르 사크레쾨르(오전)",48.8867,2.3431],["샹젤리제 거리",48.8698,2.3076],["라 발레 빌리지(RER A 약 45분)",48.873,2.781]]],
["2/19 (금)","파리 → 콜마르 → 스트라스부르",[["파리 동역(이른 출발)",48.8768,2.3592],["머리의 집",48.0786,7.3588],["쁘띠 베니스",48.0745,7.3565],["스트라스부르 대성당",48.5819,7.7507],["쁘띠 프랑스(저녁)",48.5802,7.7385]]],
["2/20 (토)","스트라스부르 → 하이델베르크 → 브뤼셀",[["스트라스부르 대성당",48.5819,7.7507],["하이델베르크 성",49.4106,8.7153],["알테 브뤼케",49.4128,8.7089],["하이델베르크 구시가지",49.4097,8.7064],["브뤼셀 그랑플라스",50.8467,4.3525]]],
["2/21 (일)","벨기에 브뤼셀",[["그랑플라스",50.8467,4.3525],["갈레리 생튀베르",50.8479,4.3544],["몽데자르",50.8446,4.3569],["아토미움",50.8949,4.3415]]],
["2/22 (월)","독일 쾰른 당일치기",[["브뤼셀 미디역",50.8355,4.3364],["쾰른 대성당",50.9413,6.9583],["라인 강변 산책로",50.9388,6.968],["초콜릿 박물관",50.9323,6.9647],["프뤼 암 돔(맥주)",50.9406,6.9597]]],
["2/23 (화)","겐트 / 브뤼헤 당일치기",[["겐트 성(그라벤스틴)",51.0572,3.7211],["성 바프 대성당",51.053,3.7276],["그라슬레이",51.0545,3.721],["브뤼헤 마르크트 광장",51.2085,3.2247],["로젠후드 부두",51.2096,3.2267]]],
["2/24 (수)","브뤼셀 쇼핑 및 귀국",[["뤼 뇌브 쇼핑가",50.8528,4.3558],["City2 쇼핑몰",50.8545,4.356],["노이하우스 초콜릿",50.8472,4.354],["브뤼셀 공항",50.901,4.4844]]]
];
const T={a:["📍","관광지"],f:["🍴","식당"],c:["☕","카페"],e:["✨","기타"]};
const E=encodeURIComponent,esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const online=()=>GAS_URL.startsWith("http");
const status=s=>document.getElementById("sync-status").innerText=s;
let cur=0,curF="info",map=null,mode="transit",cand=[];
let sharedData={memo:[],money:[],check:[],rest:[],stay:[],plan:null};
const SHN={rest:"식당",stay:"숙소",money:"정산"};
let plan={v:0,days:D.map((d,i)=>({places:d[2].map((p,j)=>({id:"d"+i+"p"+j,n:p[0],la:p[1],lo:p[2],t:"a",b:0}))}))};
const okPlan=p=>p&&p.days&&p.days.length==D.length;
const norm=r=>{["memo","money","check","rest","stay"].forEach(k=>r[k]=r[k]||[]);return r};

async function getAll(){try{return norm(await (await fetch(GAS_URL)).json())}catch(e){return null}}
async function loadData(){
 if(!online())return;
 const r=await getAll();
 if(!r){status("⚠️ 연결 실패 (이 기기에서만 보여요)");return}
 sharedData=r;if(okPlan(r.plan))plan=r.plan;
 status("✅ 공동 편집 연동 중");
}
async function init(){renderAll();await loadData();renderAll()}

function renderTabs(){document.getElementById("day-tabs").innerHTML=D.map((d,i)=>`<button class="${i==cur?"on":""}" onclick="setDay(${i})">${i+1}일차</button>`).join("")}
function renderAll(){renderTabs();updateMap();renderContent()}
function setDay(i){cur=i;cand=[];renderAll()}
function setF(f){curF=f;document.querySelectorAll("#feature-tabs button").forEach(b=>b.classList.toggle("on",b.dataset.f==f));renderContent()}

function updateMap(){
 if(map)map.remove();
 map=L.map("map",{scrollWheelZoom:false});
 L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{attribution:"Esri"}).addTo(map);
 const a=plan.days[cur].places,g=a.filter(p=>p.la!=null),pts=g.map(p=>[p.la,p.lo]);
 if(!pts.length){map.setView([48.5,5],4);return}
 L.polyline(pts,{color:"#2f7de1",weight:3,dashArray:"5, 5"}).addTo(map);
 a.forEach((p,i)=>{if(p.la==null)return;
  L.marker([p.la,p.lo],{icon:L.divIcon({className:"",html:`<div class="pin ${p.t}">${i+1}</div>`,iconSize:[26,26]})}).addTo(map).bindPopup(`<b>${esc(p.n)}</b>`)});
 map.fitBounds(L.latLngBounds(pts),{padding:[50,50],maxZoom:15});
}

/* ---------- 공동 일정 편집 ---------- */
async function mutate(fn){
 status("⏳ 저장 중...");
 if(online()){const r=await getAll();if(r&&okPlan(r.plan))plan=r.plan}
 fn();plan.v=(plan.v||0)+1;renderAll();
 if(!online())return;
 try{await fetch(GAS_URL,{method:"POST",body:JSON.stringify({type:"plan",rowData:[JSON.stringify(plan)]})})}catch(e){}
 const r=await getAll();
 if(r&&r.plan&&r.plan.v===plan.v)status("✅ 저장됨 · 일행 화면에도 반영돼요");
 else status("⚠️ 일정이 시트에 저장되지 않았어요 (Apps Script를 새 버전으로 배포했는지 확인)");
}
/* ---------- 장소 간 이동수단·이동시간 (plan.legs 에 저장 → 시트 공유) ----------
   legs["A>B"]={m:이동수단, t:분, a:1(시간 자동계산), am:1(이동수단 자동선택=최단시간)} */
const MODES=[["transit","🚇 대중교통","transit"],["walk","🚶 도보","walking"],["metro","🚇 지하철","transit"],["bus","🚌 버스","transit"],["train","🚆 기차","transit"],["boat","⛴ 배","transit"],["etc","➕ 기타","transit"]];
/* 최단시간 자동 선택 때 비교할 이동수단: 도보·대중교통만 */
const AUTO=["walking","transit"],KEY={walking:"walk",transit:"transit"};
const legKey=(a,b)=>a+">"+b;
const getLeg=(a,b)=>(plan.legs&&plan.legs[legKey(a,b)])||{m:"",t:""};
const modeOf=l=>(MODES.find(x=>x[0]==l.m)||MODES[0])[2];
const fmtMin=n=>n>=60?Math.floor(n/60)+"시간"+(n%60?" "+n%60+"분":""):n+"분";
const qp=p=>p.la!=null?p.la+","+p.lo:p.n;
const autoTried=new Set();let filling=false,lastErr="";

async function fetchMin(A,B,mode){
 let t;
 try{t=await(await fetch(GAS_URL+"?action=route&from="+E(qp(A))+"&to="+E(qp(B))+"&mode="+mode)).text()}
 catch(e){lastErr="Apps Script에 연결 못 함 ("+e+")";return null}
 let r=null;try{r=JSON.parse(t)}catch(e){lastErr="JSON 아닌 응답: "+t.slice(0,50);return null}
 if(r&&r.ok&&r.min!=null)return r.min;
 lastErr=r&&r.ok===false?"구글이 경로를 못 찾음(ok:false)":"doGet의 route 코드가 적용 안 됨(재배포 확인) → "+t.slice(0,40);
 return null;
}
/* 도보·대중교통을 계산해 더 짧은 것을 고름 */
async function fetchBest(A,B){
 const rs=await Promise.all(AUTO.map(async md=>[md,await fetchMin(A,B,md)]));
 let best=null;rs.forEach(([md,m])=>{if(m!=null&&(!best||m<best[1]))best=[md,m]});
 return best?{k:KEY[best[0]],min:best[1],auto:1}:null;
}
/* 이동수단을 직접 골랐으면 그 수단으로, 자동이면 최단시간 수단으로 계산 */
async function calc(A,B,l){
 if(l.m&&!l.am){const m=await fetchMin(A,B,modeOf(l));return m==null?null:{k:l.m,min:m,auto:0}}
 return fetchBest(A,B);
}
function applyAuto(res,force){
 plan.legs=plan.legs||{};
 res.forEach(([x,y,r])=>{const k=legKey(x,y),o=Object.assign({m:"",t:""},plan.legs[k]);
  if(o.t&&!force)return;
  o.m=r.k;if(r.auto)o.am=1;else delete o.am;o.t=r.min;o.a=1;plan.legs[k]=o});
}
/* 현재 일차에서 시간이 비어 있는 구간을 자동 계산 */
async function autoFill(){
 if(!online()||filling||curF!=="info")return;
 const a=plan.days[cur].places,todo=[];
 for(let i=0;i<a.length-1;i++){const k=legKey(a[i].id,a[i+1].id);
  if(!getLeg(a[i].id,a[i+1].id).t&&!autoTried.has(k)){autoTried.add(k);todo.push([a[i],a[i+1]])}}
 if(!todo.length)return;
 filling=true;status("⏳ 최단 이동시간 계산 중...");
 const out=await Promise.all(todo.map(async([A,B])=>{let r=null;try{r=await calc(A,B,getLeg(A.id,B.id))}catch(e){lastErr=String(e)}return r?[A.id,B.id,r]:null}));
 filling=false;
 const res=out.filter(Boolean);
 if(!res.length){status("⚠️ 자동 계산 실패: "+lastErr);return}
 mutate(()=>applyAuto(res));
}
/* 한 구간을 다시 계산 (직접 입력한 시간도 덮어씀) */
async function refreshLeg(a,b){
 if(!online()){alert("배포 URL을 넣어주세요!");return}
 const[d1,i1]=loc(a),[d2,i2]=loc(b);if(d1<0||d2<0)return;
 const A=plan.days[d1].places[i1],B=plan.days[d2].places[i2];
 status("⏳ 이동시간 계산 중...");
 let r=null;try{r=await calc(A,B,getLeg(a,b))}catch(e){lastErr=String(e)}
 if(!r){status("⚠️ 자동 계산 실패: "+lastErr);return}
 mutate(()=>applyAuto([[a,b,r]],true));
}
async function setLeg(a,b,f,v){
 const prev=getLeg(a,b);
 await mutate(()=>{
  plan.legs=plan.legs||{};const k=legKey(a,b),o=Object.assign({m:"",t:""},plan.legs[k]);
  if(f=="t"){const n=Math.max(0,Math.round(+v||0));o.t=n||"";delete o.a}
  else if(v=="auto"){o.m="";delete o.am}
  else{o.m=v;delete o.am}
  if(!o.m&&!o.t)delete plan.legs[k];else plan.legs[k]=o;
 });

function mfSync(){
 const r=document.getElementById("mfR"),k=document.getElementById("mfK"),s=document.getElementById("mfS");

 if(k&&document.activeElement!==k)k.value=mf.krw;

}
function mfCalc(){const a=parseFloat(mf.amt),r=parseFloat(mf.rate);mf.krw=(a>0&&r>0)?String(Math.round(a*r)):""}
function onMoney(f,v){
 mf[f]=v;
 if(f==="date"){mf.rate="";mf.krw="";if(mf.cur==="EUR")fetchRate()}
 else if(f==="cur"){mf.rate="";mf.krw="";mf.src="";renderContent();if(v==="EUR")fetchRate()}
 else if(f==="amt"){mfCalc();mfSync()}
 else if(f==="rate"){mf.src="✍️ 환율을 직접 입력했어요";mfCalc();mfSync()}
 else if(f==="krw"){const a=parseFloat(mf.amt),k=parseFloat(v);if(a>0&&k>0)mf.rate=(k/a).toFixed(2);mf.src="✍️ 원화 금액을 직접 입력했어요";mfSync()}
}
async function fetchRate(){
 const seq=++rateSeq,d=mf.date||todayStr(),q=/^\d{4}-\d{2}-\d{2}$/.test(d)?d:todayStr(),fut=q>todayStr();
 mf.src="⏳ "+d+" 환율 불러오는 중...";mfSync();
 const ok=(r,label,dt)=>{mf.rate=Number(r).toFixed(2);mfCalc();mf.src=`${label} ${dt} 기준${fut?" · 미래 날짜라 최신값":""} · 수정 가능`;mfSync()};
 /* 1순위: 하나은행 매매기준율 (구글 시트 스크립트가 하나은행에서 읽어 옴) */
 if(online()){
  try{
   const j=await(await fetch(`${GAS_URL}?fx=${q}`)).json();
   if(seq!==rateSeq)return;
   if(j&&j.rate>0){ok(j.rate,"✅ 하나은행 매매기준율(최종 고시)",j.date);return}
  }catch(e){}
 }
 /* 2순위: 유럽중앙은행 고시 환율 */
 for(const base of["https://api.frankfurter.dev/v1","https://api.frankfurter.app"]){
  try{
   const j=await(await fetch(`${base}/${fut?"latest":q}?base=EUR&symbols=KRW`)).json(),r=j&&j.rates&&j.rates.KRW;
   if(seq!==rateSeq)return;
   if(r>0){ok(r,"⚠️ 하나은행 조회 실패 → 유럽중앙은행 환율",j.date);return}
  }catch(e){}
 }
 if(seq===rateSeq){mf.src="⚠️ 환율 자동 조회 실패 — 환율이나 원화 금액을 직접 입력하세요";mfSync()}
}

 if(!mf.item.trim()){alert("항목을 입력하세요");return}
 if(!(a>0)){alert("금액을 입력하세요");return}
 let row;

async function post(b){
 status("⏳ 저장 중...");
 try{
  const r=await fetch(GAS_URL,{method:"POST",body:JSON.stringify(b)});
  let j=null;try{j=await r.json()}catch(e){}
  if(j&&j.ok===false){console.log("서버 거부:",j);status("⚠️ 저장 실패: "+(j.error==="changed"?"시트 내용이 달라서 거부됨":j.error));return j}
  status("✅ 저장됨 · 일행 화면에도 반영돼요");return j||{ok:true};
 }catch(e){status("⚠️ 저장 실패");return{ok:false,error:String(e)}}
}

}
